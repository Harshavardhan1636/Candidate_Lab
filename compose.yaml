services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: "1"
      DATABASE_URL: postgresql+psycopg://candidate:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/candidate_lab
      ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: candidate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: candidate_lab
    volumes:
      - candidate_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidate -d candidate_lab"]
      interval: 5s
      retries: 10
volumes:
  candidate_db:
